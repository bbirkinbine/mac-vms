# =============================================================================
# Kali rolling ARM64 preseed — mac-vms kali base
#
# Debian Installer reads this file via the kernel cmdline
#   auto=true priority=critical preseed/file=/cdrom/preseed/preseed.cfg
# baked into the repacked ISO's grub.cfg by scripts/build-kali.sh. Drives
# an unattended install. Hardening / package install beyond the
# pkgsel/include set happens in the shell provisioners after install.
#
# This is the Debian Installer (debconf-style) equivalent of the Ubuntu
# pipeline's subiquity http/user-data. The shapes are not interchangeable;
# see docs/kali-vs-ubuntu.md for the translation table.
#
# The token __KALI_META_PKG__ in the pkgsel/include line below is
# sed-substituted by the build wrapper before xorriso bakes this file
# into the ISO. Default: kali-linux-headless. Don't remove the
# placeholder or the wrapper fails loud.
# =============================================================================

### Locale + keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network
# Auto-pick the first non-loopback NIC. ARM64 Kali under Tart only ever
# sees one NIC, so 'auto' is unambiguous.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string kali-rolling-arm64-base
d-i netcfg/get_domain string unassigned-domain
# Silence the firmware-from-removable-media prompt — Tart doesn't pass
# any of that through.
d-i hw-detect/load_firmware boolean false

### Mirror — Kali primary HTTP mirror, no proxy.
# The suite MUST be pinned to kali-rolling. Without an explicit
# mirror/suite (and mirror/udeb/suite for d-i components), d-i falls
# back to whatever default suite it was built against — typically a
# Debian suite name (`stable`, `testing`) that doesn't exist on
# http.kali.org/kali. apt then builds a sources.list pointing at a
# 404'ing Release file, so pkgsel reports e.g.
#   "Package cloud-init is not available, but is referred to by another
#    package"
# during "Select and install software" and the install aborts.
d-i mirror/country string manual
d-i mirror/http/hostname string http.kali.org
d-i mirror/http/directory string /kali
d-i mirror/http/proxy string
d-i mirror/suite string kali-rolling
d-i mirror/codename string kali-rolling
d-i mirror/udeb/suite string kali-rolling
d-i mirror/udeb/components multiselect main, contrib, non-free, non-free-firmware

### apt-setup — Kali rolling has no separate security or updates suite.
# Suppress the Debian-default `security.debian.org` host that apt-setup
# would otherwise add to sources.list, and disable selection of the
# security / updates / backports services entirely. Leaving these at
# their defaults adds a 404'ing security mirror entry that breaks every
# subsequent apt update.
d-i apt-setup/services-select multiselect
d-i apt-setup/security_host string
d-i apt-setup/use_mirror boolean true

### Clock + timezone
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

### Users
# No root login — disables the root password prompt and locks the
# account. Build user gets passwordless sudo via the late_command below.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Packer Build
d-i passwd/username string packer
# SHA-512 crypt of 'packer-build-only'. MUST match var.build_password in
# variables.pkr.hcl. Regenerate with:
#   openssl passwd -6 'NEWPASS'
# Do NOT use python3 -c "import crypt; ..." on macOS — Darwin's libc only
# implements DES, so METHOD_SHA512 silently falls back to a ~13-char
# garbage string and locks the account. Same hash the Ubuntu user-data
# uses; both pipelines share the build-only password.
d-i passwd/user-password-crypted password $6$7Vsze83plLs56vXc$Y54sTTR6VlyAwIBeC531n25wOQwyIUIP8EiZO9GL0LXI6c7zn79BmE4jirkAX5RyfkhkiQgNrNHd8YI14IRp.1
d-i passwd/user-default-groups string sudo

### Partitioning — single disk, atomic recipe (one root partition, ext4).
# Mirror of Ubuntu's storage.layout.name=direct: one root, no LVM, easy
# to clone and grow. On Apple Virtualization.framework the VM boots in
# EFI mode, so d-i adds an ESP automatically alongside the atomic /.
# Do *not* preseed `partman-efi/non_efi_system boolean true` here — that
# answer means "yes, treat as non-EFI" and forces a BIOS-style install,
# which on an EFI-booted ARM64 system produces an unbootable disk.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Apt + base packages
# Skip the d-i upgrade pass. Repo policy is to never use full-upgrade in
# unattended installs (it can remove packages); 00-baseline.sh does an
# `apt-get upgrade` after the install with the dpkg-lock wait loop.
d-i pkgsel/upgrade select none
# 'standard' brings in the usual Debian basics. The Kali meta-package
# below adds the tool suite on top. cloud-init is NOT a Kali installer
# default — include it explicitly or the 99-cleanup.sh datasource lock
# and the cidata-driven clone flow have nothing to act on.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server cloud-init qemu-guest-agent ca-certificates curl sudo __KALI_META_PKG__
# Silence the popularity-contest prompt.
popularity-contest popularity-contest/participate boolean false

### Boot loader — GRUB to the disk d-i auto-detects.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Finish — auto-reboot, no "press enter" prompt.
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/reboot boolean true

### Late command — install the build user's passwordless-sudo rule.
# /target is the about-to-boot system's root, mounted in the installer
# environment. Single line: d-i's preseed line-continuation handling
# (debconf-set-selections + line-folded strings) is dependable but the
# two-statement chain below is short enough that flattening removes the
# only failure mode here. Sealing (machine-id wipe, ssh host key wipe,
# cloud-init lock, packer-cleanup unit install) happens in the
# post-install provisioner pass, not here — same shape as the Ubuntu
# pipeline.
d-i preseed/late_command string echo 'packer ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/99-packer-build ; chmod 0440 /target/etc/sudoers.d/99-packer-build
